on:
  pull_request:
     branches:
       - sources

name: 📦 Check build

permissions:
  contents: read

jobs:
  build:
    runs-on: macOS-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2

      - name: Install rmarkdown, blogdown # might need knitr
        run: Rscript -e 'install.packages(c("rmarkdown","blogdown"))'

      - name: Install hugo
        run: Rscript -e 'blogdown::install_hugo(version = "0.161.1", arch = "universal")'

      - name: Build site with blogdown
        run: Rscript -e "blogdown::build_site()"
